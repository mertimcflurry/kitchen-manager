services:
  app:
    build: .
    container_name: kitchen-manager
    restart: unless-stopped
    ports:
      - "3001:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/kitchen.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
