<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover ist Voraussetzung dafuer, dass env(safe-area-inset-*) Werte liefert -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="Küche" />
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
